name: Update SDK & Parent Repository

on:
  workflow_dispatch:
  push:
    branches:
      - stable

permissions:
  contents: write

jobs:
  update-sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SDK repository
        uses: actions/checkout@v4
        with:
          repository: JOHNnewcando/open.mp-sdk-test
          ref: master
          path: SDK
          fetch-depth: 0
          token: ${{ secrets.CI_TOKEN != '' && secrets.CI_TOKEN || github.token }}

      - name: Sync master with dev
        shell: bash
        run: |
          cd SDK

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin --prune

          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            git checkout master
            git reset --hard origin/dev
            git push --force-with-lease origin master
          else
            echo "origin/dev not found."
          fi

  update-parent:
    needs: update-sdk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout parent repository
        uses: actions/checkout@v4
        with:
          repository: JOHNnewcando/open.mp-test
          ref: master
          path: Parent
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.CI_TOKEN != '' && secrets.CI_TOKEN || github.token }}

      - name: Update SDK submodule
        shell: bash
        run: |
          cd Parent

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git submodule sync --recursive
          git submodule update --init SDK

          cd SDK
          git fetch origin
          git checkout master
          git pull origin master
          cd ..

          git add SDK

          if git diff --cached --quiet; then
            echo "SDK submodule already up to date."
            exit 0
          fi

          git commit -m "Update SDK submodule"
          git push origin master
