name: Update SDK & Network

on:
  workflow_dispatch:
  push:
    branches:
      - stable

permissions:
  contents: write

jobs:
  update-sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Clone SDK repository
        uses: actions/checkout@v4
        with:
          clean: true
          repository: "JOHNnewcando/open.mp-sdk-test"
          path: "SDK"
          ref: "master"
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.CI_TOKEN != '' && secrets.CI_TOKEN || github.token }}

      - name: Sync master with dev
        shell: bash
        run: |
          cd SDK

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin --all --prune

          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            echo "Syncing master with origin/dev..."

            git checkout master
            git reset --hard origin/dev

            git push --force-with-lease origin master

            echo "SDK synchronized successfully."
          else
            echo "Remote branch origin/dev does not exist; skipping."
          fi

  update-network:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Network repository
        uses: actions/checkout@v4
        with:
          clean: true
          repository: "openmultiplayer/open.mp-network"
          path: "Network"
          ref: "master"
          submodules: recursive
          token: ${{ secrets.CI_TOKEN != '' && secrets.CI_TOKEN || github.token }}

      - name: Update Network files from dev branch
        if: always()
        shell: bash
        run: |
          cd Network
          git fetch
          git rebase origin/dev
          git push || true
