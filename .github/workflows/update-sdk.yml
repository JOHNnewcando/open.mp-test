name: Update SDK & Network
on:
  workflow_dispatch:
  push:
    branches:
      - "stable"
jobs:
  update-sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Clone SDK repository
        uses: actions/checkout@v4
        with:
          clean: true
          repository: "JOHNnewcando/open.mp-sdk-test"
          path: "SDK"
          ref: "master"
          submodules: recursive
          token: ${{ secrets.CI_TOKEN != '' && secrets.CI_TOKEN || github.token }}

      - name: Update SDK files from dev branch
        if: always()
        shell: bash
        run: |
          cd SDK
          git fetch --all --prune
          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            git rebase origin/dev
            git push || true
          else
            echo "Remote branch origin/dev does not exist; skipping rebase/push"
          fi

  update-network:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Network repository
        uses: actions/checkout@v4
        with:
          clean: true
          repository: "openmultiplayer/open.mp-network"
          path: "Network"
          ref: "master"
          submodules: recursive
          token: ${{ secrets.CI_TOKEN != '' && secrets.CI_TOKEN || github.token }}

      - name: Update Network files from dev branch
        if: always()
        shell: bash
        run: |
          cd Network
          git fetch
          git rebase origin/dev
          git push || true
